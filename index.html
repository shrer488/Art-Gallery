<style>
/* Layout: full-screen WebGL gallery; HTML only for the entry card, HUD and the close-up viewer. Single dark world by design. */
:root {
  --night: #0b0908;      /* gallery darkness */
  --wall: #2a2420;
  --paper: #efe7da;      /* label card / mat */
  --ink: #1d1814;
  --lamp: #f2c98a;       /* warm spotlight */
  --muted: #a89c8c;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Karla", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--night); color: var(--paper); font-family: var(--body); overflow: hidden; }
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage canvas { display: block; }
#stage.locked { cursor: none; }
#fade { position: fixed; inset: 0; background: var(--night); opacity: 0; pointer-events: none; transition: opacity .35s ease; }
#fade.on { opacity: 1; }

.hud-title {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px));
  font-family: var(--display); font-size: 1.05rem; letter-spacing: .02em; color: var(--paper); opacity: .8; pointer-events: none;
}
.hud-title small { display: block; font-family: var(--body); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.rooms {
  position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
}
.rooms button, .btn {
  font: 500 .78rem/1 var(--body); letter-spacing: .08em; text-transform: uppercase;
  background: rgba(20,16,13,.72); color: var(--paper); border: 1px solid rgba(242,201,138,.35);
  padding: 10px 14px; border-radius: 2px; cursor: pointer; backdrop-filter: blur(6px);
}
.rooms button:hover, .btn:hover { border-color: var(--lamp); color: var(--lamp); }
button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.hint {
  position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); left: max(16px, env(safe-area-inset-left, 0px));
  font-size: .78rem; color: var(--muted); max-width: 64ch; pointer-events: none; line-height: 1.6;
}
.hint kbd { font: 600 .7rem var(--body); border: 1px solid #5a4f44; border-bottom-width: 2px; border-radius: 3px; padding: 1px 5px; color: var(--paper); }
.hint .walkrow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.hint .arrows { display: inline-grid; grid-template-columns: repeat(3, 22px); grid-template-rows: 22px 22px; gap: 3px; }
.hint .arrows kbd { display: grid; place-items: center; padding: 0; width: 22px; height: 22px; box-sizing: border-box; border-color: #8a7f74; border-radius: 5px; }
.hint .arrows kbd { transition: background .08s, transform .08s, border-color .08s; }
.hint .arrows kbd.on { background: rgba(255,255,255,.2); border-color: #fff; border-bottom-width: 1px; transform: translateY(1px); }
.hint .arrows svg { width: 15px; height: 15px; display: block; }
.hint .k-up { grid-column: 2; grid-row: 1; } .hint .k-l { grid-column: 1; grid-row: 2; } .hint .k-d { grid-column: 2; grid-row: 2; } .hint .k-r { grid-column: 3; grid-row: 2; }
@media (max-width: 640px) { .hint { bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); } }
.crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--paper); opacity: .7; pointer-events: none; }

/* Entry card */
#intro {
  position: fixed; inset: 0; display: grid; place-items: center;
  background: radial-gradient(ellipse at 50% 38%, rgba(242,201,138,.16), transparent 60%), rgba(11,9,8,.86);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card { max-width: 30rem; text-align: left; display: grid; gap: 18px; }
.eyebrow { font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; color: var(--lamp); }
.card h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.8rem, 9vw, 4.6rem); line-height: .95; margin: 0; text-wrap: balance; }
.card h1 em { color: var(--lamp); }
.card p { margin: 0; color: #cfc4b4; line-height: 1.55; font-size: .98rem; }
.controls { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .85rem; color: var(--muted); }
.controls dt { color: var(--paper); font-weight: 600; }
.controls dd { margin: 0; }
.enter { font: 600 .9rem/1 var(--body); letter-spacing: .14em; text-transform: uppercase; background: var(--lamp); color: var(--ink); border: 0; padding: 16px 22px; cursor: pointer; justify-self: start; border-radius: 2px; }
.enter:disabled { opacity: .5; cursor: wait; }

/* Close-up viewer: the work alone on a dark oxblood wall, glowing from behind in its copper frame,
   with its label card below and the neighbouring works peeking in from either side. */
#viewer {
  --mat: #e8dfcf;
  position: fixed; inset: 0; overflow: hidden;
  background: radial-gradient(ellipse 60% 55% at 50% 42%, #3e1410 0%, #250907 55%, #120403 100%);
  padding-block: calc(env(safe-area-inset-top, 0px) + 58px) calc(env(safe-area-inset-bottom, 0px) + 20px);
  display: grid; place-items: center;
}
/* label card sits centred below the frame */
.vmain { display: grid; grid-template-columns: auto; justify-items: center; gap: clamp(18px, 3vh, 30px); max-width: 100%; padding-inline: 16px; }
.vframe { position: relative; padding: 7px; border-radius: 2px;
  background: linear-gradient(135deg, #b8774a 0%, #7a3c1d 22%, #a8653a 45%, #5a2a14 70%, #9c5a32 100%);
  box-shadow: inset 0 1px 0 rgba(255,214,170,.35), inset 0 -1px 0 rgba(0,0,0,.5), 0 18px 40px rgba(0,0,0,.55); }
.vframe::before { /* the warm glow behind the work */
  content: ""; position: absolute; inset: -12%; z-index: -1; border-radius: 30%;
  background: radial-gradient(closest-side, rgba(255,190,120,.30), rgba(255,170,100,.10) 55%, transparent);
  filter: blur(18px); }
.vmat { background: var(--mat); padding: clamp(14px, 3.2vmin, 38px); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.vmat img { display: block; max-width: min(58vw, 900px); max-height: calc(100svh - 330px); object-fit: contain;
  outline: 3px solid #f4efe5; box-shadow: 0 0 0 3px #f4efe5, inset 0 0 0 1px rgba(0,0,0,.1); }
.vlabel { background: var(--paper); color: var(--ink); width: min(30rem, 100%); box-sizing: border-box;
  padding: 16px 22px 18px; border-radius: 2px; box-shadow: 0 10px 26px rgba(0,0,0,.45);
  display: grid; grid-template-columns: 1fr auto; column-gap: 16px; row-gap: 4px; text-align: left; }
.vlabel h2 { grid-column: 1; grid-row: 1; }
.vlabel .no { grid-column: 2; grid-row: 1; align-self: start; white-space: nowrap; padding-top: 0; line-height: 1; letter-spacing: .04em; }
.vlabel .no .cur { font-size: 1rem; }
.vlabel .no .tot { font-size: .68rem; opacity: .8; margin-left: 1px; }
.vlabel .meta, .vlabel .note { grid-column: 1 / -1; }
.vlabel .no { font-size: .66rem; letter-spacing: .22em; text-transform: uppercase; color: #8a4a26; font-variant-numeric: tabular-nums; }
.vlabel h2 { font-family: var(--display); font-weight: 400; font-size: 1.25rem; line-height: 1.1; margin: 0; text-wrap: balance; }
.vlabel .meta { margin: 0; font-size: .82rem; color: #6b5f52; }
.vlabel .note { margin: 4px 0 0; font-size: .9rem; line-height: 1.32; color: #3a312a; }
.vmain.in-r { animation: slideR .45s cubic-bezier(.2,.7,.2,1); }
.vmain.in-l { animation: slideL .45s cubic-bezier(.2,.7,.2,1); }
@keyframes slideR { from { opacity: 0; transform: translateX(40px); } }
@keyframes slideL { from { opacity: 0; transform: translateX(-40px); } }
/* previews of the previous and next works */
.peek { position: absolute; top: 42%; transform: translateY(-50%); background: none; border: 0; padding: 0; cursor: pointer;
  display: grid; justify-items: center; gap: 10px; width: clamp(84px, 10vw, 150px); color: var(--muted);
  font: 400 .78rem/1.3 var(--display); opacity: .5; transition: opacity .25s, transform .25s; }
.peek:hover, .peek:focus-visible { opacity: 1; }
.peek.prev { left: clamp(16px, 4vw, 64px); } .peek.next { right: clamp(16px, 4vw, 64px); }
.peek .pf { display: block; padding: 4px; background: linear-gradient(135deg, #a8653a, #5a2a14 60%, #9c5a32);
  box-shadow: 0 10px 22px rgba(0,0,0,.5); }
.peek .pm { display: block; background: var(--pmat, #e8dfcf); padding: 7px; }
.peek img { display: block; width: 100%; max-height: 22vh; object-fit: contain; }
.peek .pt { text-align: center; text-wrap: balance; }
.peek .pd { font: 600 .62rem/1 var(--body); letter-spacing: .2em; text-transform: uppercase; color: var(--lamp); }
.close { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); left: calc(env(safe-area-inset-left, 0px) + 16px); display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; z-index: 3; }
.close svg { width: 22px; height: 22px; flex: none; color: var(--lamp); overflow: visible; filter: drop-shadow(0 0 3px rgba(242,201,138,.45)); }
.close svg path { fill: currentColor; fill-opacity: 0; transition: fill-opacity .25s ease; }
.close:hover svg path, .close:focus-visible svg path { fill-opacity: 1; }
@media (max-width: 760px) {
  .vmat img { max-width: 66vw; max-height: calc(100svh - 360px); }
  .peek { width: 60px; top: 38%; } .peek .pt, .peek .pd { display: none; }
  .peek.prev { left: -30px; } .peek.next { right: -30px; }
  .vlabel h2 { font-size: 1.1rem; }
}
/* Talking to a visitor: a paper card like the wall labels */
.talk-hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); transform: translateX(-50%);
  font-size: .8rem; color: var(--paper); background: rgba(12,9,8,.7); padding: 7px 12px; border-radius: 2px; pointer-events: none; }
.talk-hint kbd { font: 600 .7rem var(--body); border: 1px solid #5a4f44; border-bottom-width: 2px; border-radius: 3px; padding: 1px 5px; }
#chat { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); transform: translateX(-50%);
  width: min(30rem, calc(100vw - 32px)); box-sizing: border-box; background: var(--paper); color: var(--ink);
  padding: 16px 18px 14px; border-radius: 2px; box-shadow: 0 16px 40px rgba(0,0,0,.55); display: grid; gap: 10px; }
#chat .who { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 1.15rem; }
#chat .who i { width: 10px; height: 10px; border-radius: 50%; background: var(--coat); box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
#chat .who small { font: .72rem var(--body); color: #7a6d60; letter-spacing: .04em; }
#chat .line { margin: 0; font-size: .95rem; line-height: 1.5; min-height: 1.5em; }
#chat .chips { display: flex; flex-wrap: wrap; gap: 6px; }
#chat .chips button { font: 600 .74rem/1 var(--body); letter-spacing: .03em; color: var(--ink); background: transparent;
  border: 1px solid #b9ab98; padding: 8px 10px; border-radius: 999px; cursor: pointer; }
#chat .chips button:hover, #chat .chips button:focus-visible { border-color: #8a4a26; color: #8a4a26; }
#chat form { display: flex; gap: 6px; }
#chat input { flex: 1; min-width: 0; font: .9rem var(--body); color: var(--ink); background: #fbf8f2; border: 1px solid #c9bcaa; border-radius: 2px; padding: 8px 10px; }
#chat form button { font: 600 .74rem/1 var(--body); letter-spacing: .1em; text-transform: uppercase; background: var(--ink); color: var(--paper); border: 0; padding: 0 12px; border-radius: 2px; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(() => {
const WORKS = [
  { f: "01", t: "Blue Sky", m: "Oil pastel on paper", n: "This was my first time using oil pastels. I went on a picnic with a friend to Central Park and while we talked about “which tree would you climb?” I made this.", gold: true },
  { f: "02", t: "Pavilion Under the Trees", m: "Watercolour and ink", n: "I am not very good with watercolors but I like to try. I remember painting this from a picture, which I clicked on my walk at the Central Park. This was also the day I saw turtles in the lake.", gold: true },
  { f: "03", t: "House with Stone Chimney", m: "Ink on paper", n: "I like making houses where I would like to live in one day, this happened to be one of those. The best part about drawing this was making the dark shadows with a thick brush pen at the end." },
  { f: "04", t: "Bridge Tower", m: "Ink on paper", n: "This was the first time I went to Brooklyn, an almost 53min train ride. It was for an art meet up that I found on Instagram. I remember sitting by the water when making this." },
  { f: "05", t: "Small Dog, Red Harness", m: "Watercolour and ink", n: "This was the puppy that made me obsessed with West Terrier. I remember the dog patiently waiting for the ball while its owner was busy on his phone.", gold: true },
  { f: "06", t: "Terraced House", m: "Ink on paper", n: "I find something so charming about having plants hung up on porches, stairs and balconies. They are like stickers for your house." },
  { f: "07", t: "Cottage by the Lake", m: "Ink on paper", n: "When I drew this house I imagined that a family of 5 lived here. Mum and Dad and 3 girls. And the middle one would own the room at the top right corner with the window. She was the main character." },
  { f: "08", t: "Cottage with Red Roof", m: "Watercolour and ink", n: "This house reminds me of the house of the bears from “Goldilocks and the Three Bears”.", gold: true },
  { f: "09", t: "Corner House", m: "Ink on paper", n: "My first sketch of 2026!" },
  { f: "10", t: "Studies: Hanging Forms", m: "Ink, sketchbook page", n: "Cross-hatched studies for suspended forms, annotated “depth”, “overlaps”, “moves” and “asymmetric but balanced”." },
  { f: "11", t: "Shopfront with Hanging Pots", m: "Ink on paper", n: "In my head, there is a college student in Japan that lives on the first floor of this house and always forgets his keys. The shopkeeper waits after closing hours cause he knows the kid forgot his keys." },
  { f: "12", t: "Peonies", m: "Watercolour and ink", n: "I went to an art club once when I was at Parsons and it was my first time using markers for coloring. It was fun! and I had a lot of Hi-chew!", gold: true },
  { f: "13", t: "Gabled House with Balcony", m: "Ink on paper", n: "I think Queens has the most charming set of little houses with the cutest tiny yards. This was one of them. It reminded me of how you don’t need something to be grand to make it look beautiful." },
  { f: "14", t: "Snacks", m: "Marker on paper", n: "Pocky, Hi-Chew and a bag of cookies, drawn quickly in bright marker.", gold: true },
  { f: "15", t: "Café Front", m: "Ink on paper", n: "I always wanted to have a stationary/gift shop growing up, because I was obsessed with cute stationaries and little trinkets. That dream still remains but now it is also a cafe and an art studio. What store would you have?" },
  { f: "16", t: "Flow", m: "Ink drawing", n: "This is the continuum of the Creativity series. When I made this painting, I was picturing creativity and how it flows. When you start anything it is often unknown and ambiguous, but the more you keep doing it, it starts unfolding all on its own. I wanted the river to represent that path of creativity, and the more you row the more you see the swirls of your creativity." },
  { f: "17", t: "Lighthouse", m: "Ink drawing", n: "This is the continuum of the Creativity series. It represents the people that guide us along the way in our creative journey. The clouds represent the trials and errors we have to go through before finding the right person or getting to the right solution. The poppies represent the good ideas we buried along the way." },
  { f: "18", t: "Doorway to the Sea", m: "Ink drawing", n: "This is the continuum of the Creativity series. It represents the change in ideas when we are creating. We go through phases while creating something, I like to think of them as doors, you are still deep in the process but where you are now is different from where you started." },
];

  { i: 16, at: [9.2, BACK, 0],  v: 1.6, w: 1.05, h: 1.42, fill: 0.84, frame: "ebony",   mat: "cream" },

  { i: 5,  at: [12, -21, -H],  v: 1.6, w: 1.6, h: 1.5, fill: 0.76, frame: "oak",     mat: "cream" },
  { i: 10, at: [12, -15.5, -H],    v: 1.6, w: 0.8, h: 0.8, fill: 0.7,  frame: "oxblood", mat: "oxblood" },
  { i: 12, at: [12, -10, -H],   v: 1.6, w: 1.35, h: 1.8, fill: 0.78, frame: "navy",    mat: "cream" },

function buildFrame(g, OW, OH, style) {

  const TW = OW + 2 * fw, TH = OH + 2 * fw;

  const r = 0.004, depth = Z.front - Z.back - 2 * r;

    const shape = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
    let geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelSegments: 3, curveSegments: 3 });

  // placed close to the wall at the work's centre with a gentle falloff, so it washes broadly
  // over wall and floor instead of making a hot spot
  const glow = new THREE.PointLight(0xffc28e, p.hero ? 0.55 : 0.32, p.hero ? 12 : 9, 1);
  glow.position.set(wx, p.v + 0.3, wz).addScaledVector(normal, 0.3); scene.add(glow); glows.push(glow);

      halo.position.set(0, 0, Z.wall + 0.004); halo.renderOrder = 1; g.add(halo); halos.push(halo);
    }

    const art = new THREE.Mesh(lit(new THREE.PlaneGeometry(W, Hh, 1, 12), lampY, reach), new THREE.MeshBasicMaterial({ map: tex, color: 0xfff3e2, vertexColors: true }));
    art.position.z = Z.art; art.userData.work = p.i; g.add(art); artMeshes.push(art);

const AREAS = [{ x1: -11.55, x2: 11.55, z1: -25.55, z2: -0.45 }];
const BLOCKS = [{ x: 0, z: -18, hw: 1.8, hd: 0.62 }, { x: 0, z: -9, hw: 1.8, hd: 0.62 }];
// the benches seat four a side, one per cushion; sitting faces away from the bench's middle
const SEAT_H = 0.455;
const SEATS = [];
BLOCKS.forEach((b, bi) => { for (const side of [-1, 1]) for (const x of [-1.16, -0.39, 0.39, 1.16])
  SEATS.push({ bi, x: b.x + x, z: b.z + side * 0.16, face: side > 0 ? 0 : Math.PI, ax: b.x + x, az: b.z + side * 1.1, side, by: null }); });
function free(x, z) {
  return AREAS.some(r => x > r.x1 && x < r.x2 && z > r.z1 && z < r.z2) &&
    !BLOCKS.some(b => Math.abs(x - b.x) < b.hw && Math.abs(z - b.z) < b.hd);
}
const pos = new THREE.Vector3(0, EYE, -1.4);
let userSeat = null, eyeCur = EYE;   // you can sit on a bench too
let yaw = 0, pitch = -0.02, bob = 0;
let target = null, targetYaw = null;
const keys = {};

function tryMove(dx, dz) {
  if (free(pos.x + dx, pos.z + dz)) { pos.x += dx; pos.z += dz; return true; }
  let moved = false;
  if (free(pos.x + dx, pos.z)) { pos.x += dx; moved = true; }
  if (free(pos.x, pos.z + dz)) { pos.z += dz; moved = true; }
  return moved;
}

// sitting: take the nearest free seat on your side of the bench, facing out into the room; any move stands you up
function seatNear(px, pz, maxD = 2.3) {
  let best = null, bd = maxD;
  for (const st of SEATS) {
    if (!seatFree(st) || Math.sign(pz - BLOCKS[st.bi].z) !== st.side) continue;
    const d = Math.hypot(st.ax - px, st.az - pz); if (d < bd) { bd = d; best = st; }
  }
  return best;
}

  userSeat = { st, x: st.x, z: st.z, yaw: st.side > 0 ? Math.PI : 0 };
  target = null; pos.x = st.x; pos.z = st.z + st.side * 0.04; targetYaw = userSeat.yaw;
}

addEventListener("keydown", e => {
  if (!viewer.hidden) { if (e.key === "Escape") closeViewer(); if (e.key === "ArrowRight") step(1); if (e.key === "ArrowLeft") step(-1); return; }
  if (!chat.hidden) { if (e.key === "Escape") endTalk(); return; }

    persona: "You are Riya, the artist whose drawings and paintings fill this exhibition, walking around your own show. Warm, a little shy about your work but happy to talk about it, and glad people came." },
  { name: "Theo", about: "cellist, here for the colour", coat: "#2f4a3a",
    hello: ["Evening! Have you seen the big sky on the back wall yet?", "Ah, hello. I come for the colour, mostly.", "Hello there. Quiet in here, isn't it? I like it."],
    favs: [[0, "The sky on the back wall. The pastel is scraped on so thick it almost catches the light."],
           [11, "The peonies. Two greens in the leaves and a pink that hums. That's all it needs."],
           [15, "The two boats on the black river. Those whirlpools look like a map of somewhere I'd like to get lost."],
           [4, "The little grey dog in the red harness. It makes me smile every single time."]],
    persona: "You are Theo, a cellist in his late twenties who plays in a small city orchestra and visits galleries for the colour. Warm, curious, a little shy, likes musical comparisons now and then." },

residents.forEach((r, k) => {
  r.who = PEOPLE[k]; r.favAt = Math.floor(Math.random() * 4); r.history = [];
  r.fig.traverse(o => { if (o.isMesh && !o.userData.decal) o.userData.npc = k; });
});
const npcMeshes = []; residents.forEach(r => r.fig.traverse(o => { if (o.isMesh && o.userData.npc !== undefined) npcMeshes.push(o); }));
const chat = document.getElementById("chat"), chatLine = document.getElementById("chatLine"), chips = document.getElementById("chatChips");
const chatForm = document.getElementById("chatForm"), chatInput = document.getElementById("chatInput"), talkHint = document.getElementById("talkHint");
let talking = null, nearby = null, lastFav = null, talkLocked = false, sample = null, asking = null;
const pickOne = a => a[Math.floor(Math.random() * a.length)];
function say(text) { chatLine.textContent = text; }
function setChips() {
  chips.replaceChildren();
  const add = (label, fn) => { const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.onclick = fn; chips.append(b); };
  add(lastFav === null ? "Which one's your favourite?" : "Any other favourites?", favourite);
  add("What are you looking at?", looking);
  if (lastFav !== null) add("Show me that one", () => { const i = lastFav; endTalk(false); openViewer(i); });
  add("Goodbye", () => endTalk());
}
function favourite() {
  const r = talking, [i, line] = r.who.favs[r.favAt++ % r.who.favs.length];
  lastFav = i; say(`${line} It's called “${WORKS[i].t}”.`); setChips();
}
function looking() {
  const w = WORKS[PLAN[talking.spot].i];
  lastFav = PLAN[talking.spot].i; say(`This one, “${w.t}”. ${w.n}`); setChips();
}
function talk(r) {
  if (!r) return;

  talking = r; r.talking = true; lastFav = null;
  talkLocked = talkLocked || locked; if (locked) document.exitPointerLock();
  for (const k in keys) keys[k] = false;

  chatInput.placeholder = `Ask ${r.who.name} anything…`;

  chatForm.hidden = true; chat.hidden = false; talkHint.hidden = true;   // v112 (Riya): no free-text "Ask anything" box, only the suggested chips
  chips.querySelector("button").focus();

function endTalk(relock = true) {

// a nudge when you're close enough to say hello
let hintKey = "";

  if (talking && Math.hypot(talking.fig.position.x - pos.x, talking.fig.position.z - pos.z) > 6) endTalk(false);

// ---------- loop ----------
const clock = new THREE.Clock(); let lastShadowT = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const fwd = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const side = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  const turn = (keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0);
  yaw += turn * 1.8 * dt;
  let moving = false;
  if (userSeat) { if (fwd || side) standUp(); }
  else if (fwd || side) {
    const sp = (keys.ShiftLeft || keys.ShiftRight ? 4.2 : 2.4) * dt;
    const l = Math.hypot(fwd, side);
    const dx = (-Math.sin(yaw) * fwd + Math.cos(yaw) * side) / l * sp;
    const dz = (-Math.cos(yaw) * fwd - Math.sin(yaw) * side) / l * sp;

  } else if (target) {
    const dx = target.x - pos.x, dz = target.y - pos.z, d = Math.hypot(dx, dz);
    if (d < 0.05) target = null;
    else {
      const sp = Math.min(d, Math.max(1.2, Math.min(d * 1.6, 4)) * dt);

    let diff = targetYaw - yaw; diff = Math.atan2(Math.sin(diff), Math.cos(diff));

    if (Math.abs(diff) < 0.002) targetYaw = null;
  }
  bob = moving ? bob + dt * 9 : bob * 0.9;
  eyeCur += ((userSeat ? SEAT_H + 0.74 : EYE) - eyeCur) * Math.min(1, dt * 4);
  camera.position.set(pos.x, eyeCur + Math.sin(bob) * 0.025, pos.z);
  camera.rotation.set(pitch, yaw, 0, "YXZ");
  const t = clock.elapsedTime;
  updateResidents(dt, t); updateOthers(dt, t); shareSelf(t); updateTalkHint();
  residents.forEach(r => castShadow(r.fig)); others.forEach(o => castShadow(o.fig));
  if (t - lastShadowT > 0.2) { renderer.shadowMap.needsUpdate = true; lastShadowT = t; }   // people move: refresh moonlight shadows a few times a second
  renderMirror();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.fov = innerWidth < innerHeight ? 78 : 62; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); sizeMirror();
});
})();
